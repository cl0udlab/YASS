[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-files = "0.6"
pretty_env_logger = "0.5.0"
env_logger = "0.10"
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bcrypt = "0.15"
jsonwebtoken = "9.0"
tokio = { version = "1", features = ["full"] }
time = "0.3"
lazy_static = "1.4"
rusqlite = { version = "0.32", features = ["bundled"] }
